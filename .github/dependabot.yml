version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep the renderer, core and plugins on a compatible release together.
      expressive-code:
        patterns: ["@expressive-code/*", "astro-expressive-code"]
        update-types: [minor, patch]
      patch-updates:
        patterns: ["*"]
        exclude-patterns: ["@expressive-code/*", "astro-expressive-code"]
        update-types: [patch]
    pull-request-branch-name:
      separator: "-"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # rehype-katex 7 uses KaTeX 0.16.x. Upgrade renderer and CSS together.
      - dependency-name: katex
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
