name: 内容勘误
description: 反馈文章中的错字、公式、代码、失效链接或事实错误。
title: "[勘误] "
body:
  - type: input
    id: location
    attributes:
      label: 文章地址
      placeholder: https://blog.lucius7.cn/posts/文章名/
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 原文与建议修改
      description: 指出具体段落，并说明应如何修正。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 依据或补充信息
      description: 如涉及技术或事实判断，可附官方文档、参考链接或复现结果。
