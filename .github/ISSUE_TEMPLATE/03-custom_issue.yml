name: Content correction
description: Report typos, incorrect math or code, broken links, or factual errors in a post.
title: "[Correction] "
body:
  - type: input
    id: location
    attributes:
      label: Post URL
      placeholder: https://blog.lucius7.cn/posts/post-name/
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Original text and suggested correction
      description: Identify the specific passage and explain how it should be corrected.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Supporting evidence or context
      description: For technical or factual corrections, include official documentation, references, or reproduction results if available.
