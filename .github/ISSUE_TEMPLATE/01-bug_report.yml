name: 问题反馈
description: 报告博客页面、功能或本地构建的问题。
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: 页面地址或文件路径
      placeholder: https://blog.lucius7.cn/posts/文章名/，或本地构建命令
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 问题与复现步骤
      description: 描述实际发生的情况，以及如何再次遇到这个问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你期望页面或功能如何表现？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 页面问题填写设备、系统和浏览器；构建问题填写 Node.js 与 pnpm 版本。
      placeholder: iPhone / iOS / Safari，或 macOS / Node.js 22 / pnpm 9.14.4
  - type: textarea
    id: context
    attributes:
      label: 截图、日志或其他信息
      description: 可拖入截图或粘贴相关错误日志，请移除密码、令牌等敏感信息。
