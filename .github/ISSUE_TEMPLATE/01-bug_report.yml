name: Bug report
description: Report a problem with blog pages, features, or local builds.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Page URL or file path
      placeholder: https://blog.lucius7.cn/en/posts/post-name/ or a local build command
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Problem and reproduction steps
      description: Describe what happened and how to reproduce it.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: How should the page or feature behave?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For page issues, include your device, OS, and browser. For build issues, include Node.js and pnpm versions.
      placeholder: iPhone / iOS / Safari, or macOS / Node.js 22 / pnpm 9.14.4
  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs, or additional context
      description: Attach screenshots or relevant error logs. Remove passwords, tokens, and other sensitive information.
