name: 功能建议
description: 提出博客阅读体验、页面或功能的改进建议。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 目前遇到什么不便？建议将帮助你完成什么事情？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述你希望看到的具体行为或效果。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 相关页面或参考资料
      description: 可附博客页面地址、截图、参考实现或其他可行方案。
