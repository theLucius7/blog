name: Feature request
description: Suggest improvements to the blog's reading experience, pages, or features.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What is difficult today, and what would this improvement help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or result you would like to see.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related pages or references
      description: Include blog URLs, screenshots, reference implementations, or alternatives if useful.
